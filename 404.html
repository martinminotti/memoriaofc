<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost in time — MEMORIA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --gutter:clamp(16px,3.2vw,44px);
  --sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --reveal:cubic-bezier(.28,.11,.32,1);   /* apple.com reveal curve */
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{margin:0;min-height:100svh;background:#000;color:#f5f5f7;font-family:var(--sans);-webkit-font-smoothing:antialiased;font-optical-sizing:auto;overflow:hidden;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

/* Header, same as the site */
.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(12px,2.4vw,40px);
  padding:12px var(--gutter);padding-top:max(12px,env(safe-area-inset-top));font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.bar .rule{height:1px;background:currentColor;opacity:.9;transform-origin:left;transform:scaleX(0);animation:rule 1.4s var(--reveal) .1s forwards}
@keyframes rule{to{transform:scaleX(1)}}

main{min-height:100svh;display:grid;place-items:center;padding:96px var(--gutter) calc(48px + env(safe-area-inset-bottom));position:relative}
.stage{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(24px,5vw,80px);width:100%;max-width:1200px}

/* The ring: materializes, then the light follows you across the chrome */
.ring{position:relative;justify-self:center;width:min(70vw,460px,46svh);aspect-ratio:1;
  opacity:0;filter:blur(16px);transform:scale(1.08);animation:materialize 1.8s var(--reveal) .15s forwards}
@keyframes materialize{to{opacity:1;filter:blur(0);transform:scale(1)}}
.ring img{width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;display:block}
.sheen,.tint{position:absolute;inset:0;pointer-events:none;
  -webkit-mask:url(/assets/ring-mask.png) center/contain no-repeat;mask:url(/assets/ring-mask.png) center/contain no-repeat}
.sheen{mix-blend-mode:screen;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%) no-repeat;background-size:300% 100%;background-position:var(--sx,100%) 0}
.tint{mix-blend-mode:color;background:url(/assets/tex-violet.jpg) center/cover;opacity:var(--to,0)}

/* Copy */
.code{font-family:var(--mono);font-size:.75rem;color:#86868b;letter-spacing:.02em;margin:0 0 18px}
h1{margin:0;font-size:clamp(2.8rem,7vw,6.5rem);line-height:.96;letter-spacing:-.045em;font-weight:600}
h1 span{display:block;width:max-content;max-width:100%;padding-bottom:.04em;-webkit-background-clip:text;background-clip:text;color:transparent;background-size:cover;background-position:70% 50%;
  opacity:0;filter:blur(8px);animation:word 1.2s var(--reveal) forwards}
h1 .s{background-image:url(/assets/tex-silver.jpg);animation-delay:.55s}
h1 .o{background-image:url(/assets/tex-orange.jpg);animation-delay:.75s}
h1 .v{background-image:url(/assets/tex-violet.jpg);animation-delay:.95s}
@keyframes word{to{opacity:1;filter:none}}
.sub{margin:24px 0 0;max-width:34ch;color:#a1a1a6;font-size:1rem;line-height:1.5;opacity:0;animation:word 1.2s var(--reveal) 1.15s forwards}
.home{display:inline-flex;align-items:center;gap:12px;margin-top:36px;padding:14px 16px 14px 22px;border-radius:999px;background:#f5f5f7;color:#000;font-weight:600;font-size:.9375rem;letter-spacing:-.01em;
  opacity:0;animation:word 1.2s var(--reveal) 1.3s forwards;transition:transform .5s var(--reveal),background .4s var(--reveal)}
.home .go{width:28px;height:28px;border-radius:50%;background:#000;color:#f5f5f7;display:grid;place-items:center;transition:transform .6s var(--reveal)}
.home svg{width:12px;height:12px}
@media (hover:hover){.home:hover .go{transform:translateX(3px)}}
.home:active{transform:scale(.97);transition-duration:.1s}
.home:focus-visible{outline:2px solid #f9501f;outline-offset:4px}

/* Glow, as in the site's footer */
main::before{content:"";position:absolute;left:-20%;right:-20%;bottom:-55%;height:80%;pointer-events:none;
  background:radial-gradient(ellipse at 30% 50%,rgba(249,80,31,.28),transparent 55%),radial-gradient(ellipse at 72% 50%,rgba(138,77,245,.26),transparent 55%);filter:blur(50px)}

@media (max-width:760px){
  .bar{font-size:.6875rem}
  .stage{grid-template-columns:1fr;gap:28px;text-align:left}
  .ring{width:min(62vw,36svh)}
  h1{font-size:clamp(2.6rem,12vw,3.4rem)}
}
@media (prefers-reduced-motion:reduce){
  .ring,h1 span,.sub,.home{animation:none;opacity:1;filter:none;transform:none}
  .bar .rule{animation:none;transform:none}
}
</style>
</head>
<body>
<header class="bar">
  <a href="/">Memoria</a>
  <span class="rule" aria-hidden="true"></span>
  <span>404</span>
</header>
<main>
  <div class="stage">
    <div class="ring" id="ring" aria-hidden="true">
      <img src="/assets/chrome-ring.jpg" alt="">
      <div class="tint" id="tint"></div>
      <div class="sheen" id="sheen"></div>
    </div>
    <div>
      <p class="code">Error 404</p>
      <h1><span class="s">Lost.</span><span class="o">Beyond.</span><span class="v">Time.</span></h1>
      <p class="sub">This page doesn’t exist — or it has already become a memory.</p>
      <a class="home" href="/">Back to Memoria <span class="go" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M2 7h10M7.5 2.5L12 7l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span></a>
    </div>
  </div>
</main>
<script>
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const sheen = document.getElementById('sheen'), tint = document.getElementById('tint');
  // Critically damped spring (Apple's damping + response): the light settles, never overshoots
  const k = (2 * Math.PI / 0.55) ** 2, c = 4 * Math.PI / 0.55;
  let x = 0, v = 0, target = 1, raf = 0, last = 0;
  function tick(t) {
    const dt = Math.min(0.05, last ? (t - last) / 1000 : 1 / 60); last = t;
    for (let i = 0, n = Math.ceil(dt * 240), h = dt / n; i < n; i++) { v += (-k * (x - target) - c * v) * h; x += v * h; }
    sheen.style.setProperty('--sx', (100 - x * 100).toFixed(2) + '%');
    tint.style.setProperty('--to', (0.35 * Math.max(0, Math.min(1, x))).toFixed(3));
    if (Math.abs(v) > 1e-4 || Math.abs(x - target) > 1e-4) raf = requestAnimationFrame(tick); else { raf = 0; last = 0; }
  }
  const go = () => { if (!raf) raf = requestAnimationFrame(tick); };
  // On arrival one pass of light crosses the chrome, as the ring finishes materializing
  setTimeout(() => { target = 0.5; go(); }, 900);
  // Then the light follows the pointer or finger, 1:1 in intent, settling on the spring
  const follow = e => { const p = e.touches ? e.touches[0] : e; target = 0.1 + 0.8 * (p.clientX / innerWidth); go(); };
  addEventListener('pointermove', follow, { passive: true });
  addEventListener('touchmove', follow, { passive: true });
})();
</script>
</body>
</html>
